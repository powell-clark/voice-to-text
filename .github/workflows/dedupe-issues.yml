name: Dedupe Issues

# On every opened issue, ask Claude whether it duplicates an existing one and,
# if so, post a marker comment. The companion auto-close-duplicates.yml closes
# stale-flagged duplicates after a grace period unless a human objected.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to dedupe"
        required: true
        type: string

jobs:
  dedupe-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dedupe-issues-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run dedupe
        id: dedupe
        uses: anthropics/claude-code-action@v1
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dedupe bot-authored issues too
          allowed_bots: "dependabot[bot],github-actions[bot]"
          prompt: "/dedupe ${{ github.repository }}/issues/${{ env.ISSUE_NUMBER }}"
          # Tier alias `sonnet` resolves to the latest Sonnet at run time.
          claude_args: "--max-turns 120 --model sonnet"

      - name: Upload Claude transcript (dedupe)
        if: ${{ always() && steps.dedupe.outputs.execution_file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-transcript-dedupe-${{ github.run_id }}
          path: ${{ steps.dedupe.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Render transcript to run summary (dedupe)
        if: ${{ always() && steps.dedupe.outputs.execution_file != '' }}
        run: python3 scripts/ci/render-transcript.py "${{ steps.dedupe.outputs.execution_file }}" >> "$GITHUB_STEP_SUMMARY" || true

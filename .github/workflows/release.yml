name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          brew install cmake

      - name: Build VTT.app
        run: |
          set -e
          make clean
          make vendor-whisper || echo "⚠️ Vendor whisper failed, continuing..."
          make whisper-lib || echo "⚠️ Whisper lib build failed, continuing..."
          make package

          # Verify build artifacts
          if [ ! -f VTT.app.tar.gz ]; then
            echo "❌ Build failed: VTT.app.tar.gz not found"
            exit 1
          fi

          # Verify app structure before packaging
          tar -tzf VTT.app.tar.gz | grep -q "VTT.app/Contents/MacOS/VTT" || {
            echo "❌ Invalid app bundle structure"
            exit 1
          }

          echo "✅ Build verification passed"

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(shasum -a 256 VTT.app.tar.gz | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Verify SHA256 calculated
        run: |
          if [ -z "${{ steps.sha256.outputs.sha256 }}" ]; then
            echo "❌ SHA256 calculation failed"
            exit 1
          fi
          echo "✅ SHA256: ${{ steps.sha256.outputs.sha256 }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: VTT.app.tar.gz
          body: |
            ## Installation

            ```bash
            brew upgrade powell-clark/voice-to-text/voice-to-text
            ```

            Or for first-time installation:

            ```bash
            brew tap powell-clark/voice-to-text
            brew install --cask voice-to-text
            ```

            ## What's Changed

            See commit history for details.

            **SHA256**: `${{ steps.sha256.outputs.sha256 }}`
            **Version**: `v${{ steps.version.outputs.version }}`

            ## Verification

            ```bash
            shasum -a 256 VTT.app.tar.gz
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: powell-clark/homebrew-voice-to-text
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update cask formula
        run: |
          cat > homebrew-tap/Casks/voice-to-text.rb << 'EOF'
          cask "voice-to-text" do
            version "${{ steps.version.outputs.version }}"
            sha256 "${{ steps.sha256.outputs.sha256 }}"

            url "https://github.com/powell-clark/voice-to-text/releases/download/v#{version}/VTT.app.tar.gz"
            name "VTT"
            desc "Voice to Text - macOS menu bar app for real-time voice transcription"
            homepage "https://github.com/powell-clark/voice-to-text"

            app "VTT.app"

            zap trash: [
              "~/Library/Preferences/com.powellclark.voice-to-text.plist",
              "/tmp/VTT",
            ]

            caveats <<~EOS
              On first run, grant these permissions in System Settings → Privacy & Security:
                • Microphone - For audio capture
                • Accessibility - For pasting text
                • Input Monitoring - For global hotkey

              VTT will automatically download Whisper models when you select a size.

              Usage: Hold Right Option key and speak. Release to transcribe and paste.
            EOS
          end
          EOF

      - name: Commit and push cask update
        working-directory: homebrew-tap
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet Casks/voice-to-text.rb; then
            echo "⚠️ No changes to cask formula"
            exit 0
          fi

          git add Casks/voice-to-text.rb
          git commit -m "Update voice-to-text to v${{ steps.version.outputs.version }}"

          # Retry push up to 3 times with exponential backoff
          for i in 1 2 3; do
            if git push; then
              echo "✅ Cask update pushed successfully"
              exit 0
            else
              echo "⚠️ Push failed, attempt $i/3"
              sleep $((2 ** i))
            fi
          done

          echo "❌ Failed to push cask update after 3 attempts"
          exit 1

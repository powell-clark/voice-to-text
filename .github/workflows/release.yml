name: Release

# Fires on version tags (v*) and manual dispatch.
# Builds the Linux binary on ubuntu-24.04 (matching Launchpad Noble),
# then creates a GitHub release with vtt-linux as the artifact.
#
# Smoothness invariants (TASK-VTT107):
#   * The release build is "does it compile", NOT lint-clean. Lint (-D warnings
#     + clippy) is enforced on every PR by ci.yml, so a stray warning must never
#     fail the job that *publishes* a release (this is what silently broke
#     v2.3.4/2.3.5). Release jobs therefore run with RUSTFLAGS unset.
#   * Every job has a timeout so a hung/queued runner can't stall a release.
#   * publish-release waits only on the three always-available runners
#     (Linux, Windows, macos-latest/arm64). The scarce macos-13 Intel runner is
#     decoupled: it attaches its asset best-effort whenever it gets scheduled,
#     and never blocks the publish.
#
# PPA upload (dput to Launchpad) still runs locally — it requires
# Emmanuel's GPG key and cannot run on CI without secret management.
# After CI creates the release, run scripts/release-ppa.sh locally.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# One release per tag at a time. If you push two tags quickly,
# the first run finishes before the second starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Network resilience for every job (TASK-VTT107). crates.io downloads
# intermittently fail on GitHub runners with "[16] Error in the HTTP2 framing
# layer" — disabling HTTP/2 multiplexing avoids that curl bug, and a high retry
# count rides out transient blips so a flake never fails a release.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  build-and-release:
    name: Build Linux binary + create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libvulkan-dev \
            libxtst-dev \
            libnotify-bin \
            pkg-config \
            cmake \
            glslc

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # No -D warnings here on purpose: lint is a PR gate (ci.yml), not a
      # release gate. A warning must never fail the job that creates the release.
      - name: Build release binary
        run: cargo build --release
        env:
          RUSTFLAGS: ""

      - name: Verify binary shape
        run: |
          file target/release/vtt-linux | grep -q "ELF 64-bit LSB.*x86-64"
          ldd target/release/vtt-linux | grep -q "libvulkan.so.1"

      - name: Generate release notes from CHANGELOG
        run: |
          bash scripts/gen-release-notes.sh \
            "${GITHUB_REF_NAME#v}" "${{ github.repository }}" "${GITHUB_REF_NAME}" \
            > release-notes.md
          echo "----- release notes -----"; cat release-notes.md

      - name: Create GitHub release (draft until all assets are up)
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/vtt-linux
          body_path: release-notes.md
          # Keep the release hidden until the macOS + Windows jobs have uploaded
          # their assets — the publish-release job un-drafts it. Avoids a release
          # appearing with a missing .msi for the minutes the Windows build runs.
          draft: true

  build-windows-msi:
    name: Build Windows .msi installer
    needs: build-and-release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # whisper.cpp's Vulkan sub-build (vulkan-shaders-gen) blows past Windows'
      # 260-char MAX_PATH under the default target dir → MSBuild FTK1011. A short
      # target dir keeps generated paths under the limit.
      CARGO_TARGET_DIR: C:\t

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install WiX Toolset 3.x
        run: choco install wixtoolset -y --no-progress

      - name: Install cargo-wix
        run: cargo install --locked cargo-wix

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ver = "1.4.350.0"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan-sdk.exe" `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\$ver\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build release binary
        run: cargo build --release
        env:
          RUSTFLAGS: ""

      - name: Build .msi installer
        run: cargo wix --no-build --output "target\wix\voice-to-text-installer.msi"

      - name: Upload .msi to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target\wix\voice-to-text-installer.msi
          draft: true

  # Apple Silicon (arm64) on macos-latest. This is the REQUIRED macOS asset —
  # macos-latest runners are plentiful, so publish never waits long on it. The
  # Intel binary is a separate, best-effort job below.
  build-macos-arm:
    name: Build macOS binary (Apple Silicon)
    needs: build-and-release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake (whisper.cpp build dep)
        run: brew install cmake

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release

      # The [[bin]] name is vtt-linux on every platform; rename per-arch.
      - name: Rename artifact
        run: cp target/release/vtt-linux vtt-macos-arm64

      - name: Upload macOS arm64 binary to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: vtt-macos-arm64
          draft: true

  # Intel x86_64 on macos-13. macos-13 (Intel) runners are scarce and can queue
  # for a long time, so this job is DECOUPLED from publish-release: it is not in
  # publish's needs, and it attaches its asset with `gh release upload` (which
  # never alters the release's draft/latest state) so a late finish quietly adds
  # the Intel binary to an already-published release instead of re-drafting it.
  # A universal binary via lipo (TASK-VTT104) is the eventual consolidation.
  build-macos-intel:
    name: Build macOS binary (Intel) [best-effort]
    needs: build-and-release
    runs-on: macos-13
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake (whisper.cpp build dep)
        run: brew install cmake

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release

      - name: Rename artifact
        run: cp target/release/vtt-linux vtt-macos-intel

      # gh release upload (not action-gh-release) so this best-effort, possibly
      # late job only ADDS the asset and never touches draft/latest state.
      - name: Attach Intel binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" vtt-macos-intel \
            --repo "${{ github.repository }}" --clobber

  publish-release:
    name: Publish release (un-draft once core assets are uploaded)
    # Intentionally NOT depending on build-macos-intel — the scarce Intel runner
    # must never block a publish. Intel attaches best-effort (see that job).
    needs: [build-and-release, build-windows-msi, build-macos-arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Un-draft and mark latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --draft=false --latest

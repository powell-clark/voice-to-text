name: Release

# Fires on version tags (v*) and manual dispatch.
# Builds the Linux binary on ubuntu-24.04 (matching Launchpad Noble),
# then creates a GitHub release with vtt-linux as the artifact.
#
# PPA upload (dput to Launchpad) still runs locally — it requires
# Emmanuel's GPG key and cannot run on CI without secret management.
# After CI creates the release, run scripts/release-ppa.sh locally.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# One release per tag at a time. If you push two tags quickly,
# the first run finishes before the second starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Linux binary + create GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libvulkan-dev \
            libxtst-dev \
            libnotify-bin \
            pkg-config \
            cmake \
            glslc

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release
        env:
          RUSTFLAGS: "-D warnings"

      - name: Verify binary shape
        run: |
          file target/release/vtt-linux | grep -q "ELF 64-bit LSB.*x86-64"
          ldd target/release/vtt-linux | grep -q "libvulkan.so.1"

      - name: Generate release notes from CHANGELOG
        run: |
          bash scripts/gen-release-notes.sh \
            "${GITHUB_REF_NAME#v}" "${{ github.repository }}" "${GITHUB_REF_NAME}" \
            > release-notes.md
          echo "----- release notes -----"; cat release-notes.md

      - name: Create GitHub release (draft until all assets are up)
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/vtt-linux
          body_path: release-notes.md
          # Keep the release hidden until the macOS + Windows jobs have uploaded
          # their assets — the publish-release job un-drafts it. Avoids a release
          # appearing with a missing .msi for the minutes the Windows build runs.
          draft: true

  build-windows-msi:
    name: Build Windows .msi installer
    needs: build-and-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # whisper.cpp's Vulkan sub-build (vulkan-shaders-gen) blows past Windows'
      # 260-char MAX_PATH under the default target dir → MSBuild FTK1011. A short
      # target dir keeps generated paths under the limit.
      CARGO_TARGET_DIR: C:\t

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install WiX Toolset 3.x
        run: choco install wixtoolset -y --no-progress

      - name: Install cargo-wix
        run: cargo install --locked cargo-wix

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ver = "1.4.350.0"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan-sdk.exe" `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\$ver\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build release binary
        run: cargo build --release
        env:
          RUSTFLAGS: ""

      - name: Build .msi installer
        run: cargo wix --no-build --output "target\wix\voice-to-text-installer.msi"

      - name: Upload .msi to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target\wix\voice-to-text-installer.msi
          draft: true

  # macOS ships two native binaries — Intel (x86_64, macos-13 runner) and Apple
  # Silicon (arm64, macos-latest). Both use the Metal whisper backend. Native
  # builds (no cross-compile) keep the whisper.cpp/Metal build simple and
  # low-risk. A single universal binary via lipo is a follow-up (TASK-VTT104);
  # a signed .app is TASK-VTT040.
  build-macos:
    name: Build macOS binary (${{ matrix.label }})
    needs: build-and-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13      # Intel x86_64
            label: Intel
            asset: vtt-macos-intel
          - runner: macos-latest  # Apple Silicon arm64
            label: Apple Silicon
            asset: vtt-macos-arm64
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake (whisper.cpp build dep)
        run: brew install cmake

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release

      # The [[bin]] name is vtt-linux on every platform; rename per-arch.
      - name: Rename artifact
        run: cp target/release/vtt-linux ${{ matrix.asset }}

      - name: Upload macOS binary to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          draft: true

  publish-release:
    name: Publish release (un-draft once all assets are uploaded)
    needs: [build-and-release, build-windows-msi, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Un-draft and mark latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --draft=false --latest

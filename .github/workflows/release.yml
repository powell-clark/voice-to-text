name: Release

# Fires on version tags (v*) and manual dispatch.
# Builds the Linux binary on ubuntu-24.04 (matching Launchpad Noble),
# then creates a GitHub release with vtt-linux as the artifact.
#
# PPA upload (dput to Launchpad) still runs locally — it requires
# Emmanuel's GPG key and cannot run on CI without secret management.
# After CI creates the release, run scripts/release-ppa.sh locally.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# One release per tag at a time. If you push two tags quickly,
# the first run finishes before the second starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Linux binary + create GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libvulkan-dev \
            libxtst-dev \
            libnotify-bin \
            pkg-config \
            cmake \
            glslc

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release
        env:
          RUSTFLAGS: "-D warnings"

      - name: Verify binary shape
        run: |
          file target/release/vtt-linux | grep -q "ELF 64-bit LSB.*x86-64"
          ldd target/release/vtt-linux | grep -q "libvulkan.so.1"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/vtt-linux
          generate_release_notes: true
          body: |
            ## Install on Ubuntu (PPA)

            ```bash
            sudo add-apt-repository ppa:powellclark/voice-to-text
            sudo apt install voice-to-text
            ```

            Or download `vtt-linux` and place it at `/usr/bin/vtt-linux`.

            ## Install on Windows 11

            Download `voice-to-text-installer.msi` and run it.
            Installs to `C:\Program Files\Voice to Text\` with a Start Menu shortcut.

  build-windows-msi:
    name: Build Windows .msi installer
    needs: build-and-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install WiX Toolset 3.x
        run: choco install wixtoolset -y --no-progress

      - name: Install cargo-wix
        run: cargo install --locked cargo-wix

      - name: Build release binary
        run: cargo build --release
        env:
          RUSTFLAGS: ""

      - name: Build .msi installer
        run: cargo wix --no-build --output "target\wix\voice-to-text-installer.msi"

      - name: Upload .msi to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target\wix\voice-to-text-installer.msi

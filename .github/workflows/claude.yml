name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Defence in depth: the trigger requires BOTH an @claude mention AND a
    # trusted author (OWNER/MEMBER/COLLABORATOR — i.e. someone who already has
    # write access). Without the association gate, any drive-by commenter could
    # invoke @claude, and the build-command allowlist below would hand them code
    # execution on the runner (which carries CLAUDE_CODE_OAUTH_TOKEN). The
    # claude-code-action also checks actor permissions internally; this is the
    # second, workflow-level barrier. Each event carries author_association at a
    # different path, so the check is paired per event.
    # NOTE: this also stops bot-relayed @claude mentions (e.g. Dependabot, assoc
    # NONE/CONTRIBUTOR) from triggering — intentional, since Dependabot PRs carry
    # untrusted dependency code we don't want auto-executing build commands.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # issue_comment runs privileged (base-branch context, token present) and
      # the action then works on the PR head, so a trusted @claude on a
      # stranger's fork PR would hand the fork's text and build.rs the token.
      # Fails closed: anything but an explicit "false" refuses.
      - name: Refuse fork pull requests
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          cross="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)"
          if [ "$cross" != "false" ]; then
            echo "::error::@claude does not run on fork pull requests"; exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # Toolchain prelude — WITHOUT this, cargo and the system build deps are
      # absent, so @claude requests that need to build, clippy, or run the suite
      # (e.g. /iterate) fall back to inspection-only. With it, Claude can produce
      # a real green-test artifact. Matches debian/control Build-Depends + ci.yml.
      - name: Install system build deps (matches ci.yml)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libvulkan-dev \
            libxtst-dev \
            libnotify-bin \
            pkg-config \
            cmake \
            glslc

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Pick the model from the @claude mention. We pass tier ALIASES
      # (opus/sonnet/haiku) — not dated IDs — so the CLI always resolves to the
      # latest model in that tier and the workflow never goes stale as new models
      # ship. `@claude opus` = deep analysis; `@claude haiku` = cheap/fast; bare
      # or `@claude sonnet` = balanced default. The trigger body is read via env
      # so untrusted comment text never reaches the shell directly.
      - name: Detect model from @claude mention
        id: model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          BODY="${COMMENT_BODY}${ISSUE_BODY}${ISSUE_TITLE}${REVIEW_BODY}"
          if printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+opus'; then
            echo "model=opus" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+haiku'; then
            echo "model=haiku" >> "$GITHUB_OUTPUT"
          else
            echo "model=sonnet" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Model driven by the `@claude [opus|haiku]` trigger above (controlled
          # alias from the step, never untrusted comment text — no injection
          # path). --allowedTools pre-approves the build/test commands so
          # /iterate can run the suite non-interactively; each entry is a named
          # subcommand, never bare cargo/git/gh, whose aliases and -c options
          # run arbitrary shell. --append-system-prompt self-reports the model
          # so the operator sees which tier answered at a glance.
          claude_args: '--model ${{ steps.model.outputs.model }} --fallback-model haiku --max-turns 120 --allowedTools "Bash(cargo build:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo fmt:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh issue view:*)" --append-system-prompt "Start your reply with this exact line, nothing before it: 🤖 model=${{ steps.model.outputs.model }}"'

      - name: Upload Claude transcript (claude)
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-transcript-claude-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Render transcript to run summary (claude)
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        run: python3 scripts/ci/render-transcript.py "${{ steps.claude.outputs.execution_file }}" >> "$GITHUB_STEP_SUMMARY" || true

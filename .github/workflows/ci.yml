name: CI

# Runs on every push to main and every PR targeting main. Manual trigger
# available for rechecking after marketplace / toolchain drift.
# No untrusted input (issue/PR bodies, commit messages) is used in run: blocks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel older runs on the same ref when a newer one starts. Saves CI
# minutes when pushing quickly in succession (common during autonomous
# or long sessions). The latest push's CI is authoritative anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Ride out transient crates.io download flakes (HTTP/2 framing errors) so a
  # network blip never reds a PR. Mirrors release.yml (TASK-VTT107).
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  check:
    name: fmt + clippy + test + build (ubuntu-24.04)
    # ubuntu-24.04 matches Launchpad Noble builders. When we add jammy-only
    # checks later (TASK-VTT048) they go in a separate job.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate regression gates
        run: bash scripts/ci/check-regression-gates.sh

      - name: Install system build deps (matches debian/control Build-Depends)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libvulkan-dev \
            libxtst-dev \
            libnotify-bin \
            pkg-config \
            cmake \
            glslc

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --release

      - name: cargo build --release
        run: cargo build --release

      # Sanity: the produced binary is an ELF x86_64 Linux binary linked
      # against Vulkan. Launchpad's own builder does the equivalent check.
      - name: Verify binary shape
        run: |
          file target/release/vtt-linux | grep -q "ELF 64-bit LSB.*x86-64"
          ldd target/release/vtt-linux | grep -q "libvulkan.so.1"

  build-windows:
    name: build (windows-latest, x86_64-msvc, Vulkan whisper)
    # Windows compile gate (STORY-VTT013). Builds the Windows target with GPU
    # acceleration (whisper-rs `vulkan` feature, FEAT-VTT024 / TASK-VTT088).
    # cmake + MSVC + libclang are preinstalled on windows-latest; the Vulkan SDK
    # (glslc + headers + vulkan-1.lib) is installed below so whisper.cpp's Vulkan
    # backend builds. CARGO_TARGET_DIR is shortened because whisper.cpp's nested
    # vulkan-shaders-gen sub-build otherwise trips Windows' 260-char MAX_PATH.
    runs-on: windows-latest
    # The gate is "does it compile", not lint-clean — don't inherit -D warnings.
    env:
      RUSTFLAGS: ""
      CARGO_TARGET_DIR: C:\t
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ver = "1.4.350.0"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan-sdk.exe" `
            -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\$ver\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Compile everything — lib, bin, and tests — without running. A green
      # result here is the actual proof the Windows target builds. Test
      # execution (which may need audio/display) is a later task once green.
      - name: cargo build --all-targets
        run: cargo build --all-targets

  build-windows-arm64:
    name: build (windows-11-arm, aarch64-msvc, CPU whisper)
    # ARM64 Windows compile gate (TASK-VTT064, STORY-VTT013). The ARM64 tester
    # runs a Snapdragon X Plus, and this is the target their binary comes from.
    #
    # Deliberately NO Vulkan SDK step: this target builds whisper-rs CPU-only,
    # because the Adreno Vulkan path on Windows-on-ARM is unproven and the Oryon
    # cores run base/small models in real time on CPU. The arch split in
    # Cargo.toml is what makes that true — the generic windows cfg matches
    # aarch64 too, so without it this job would fail looking for an SDK that
    # does not ship for the target.
    runs-on: windows-11-arm
    # Compile gate, not a lint gate — don't inherit -D warnings.
    env:
      RUSTFLAGS: ""
      CARGO_TARGET_DIR: C:\t
      # ggml refuses to configure for ARM under MSVC — ggml-cpu/CMakeLists.txt
      # raises "MSVC is not supported for ARM, use clang" — so this job has to
      # build whisper.cpp with clang-cl. Under the Visual Studio generator the
      # compiler comes from the -T toolset, which the cmake crate only exposes
      # through a builder call whisper-rs-sys never makes. Ninja is the way in:
      # there the cmake crate forwards the cc-crate compiler through as
      # CMAKE_C_COMPILER, so CC/CXX below actually reach CMake. Both clang-cl
      # (LLVM 20.1.6) and ninja (1.13.2) ship on the windows-11-arm image
      # (TASK-VTT169).
      CMAKE_GENERATOR: Ninja
      CC_aarch64_pc_windows_msvc: clang-cl
      CXX_aarch64_pc_windows_msvc: clang-cl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (stable, aarch64-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Green here is the compile proof criterion 2 asks for. Running the binary
      # on real Snapdragon hardware is criterion 4 and cannot be done in CI.
      - name: cargo build --all-targets
        run: cargo build --all-targets

  build-macos:
    name: build (macos-latest, arm64, Metal whisper)
    # macOS compile gate — free on public repos (GitHub-hosted runner).
    # Uses the same CPU/Metal Whisper as Cargo.toml's macOS block.
    # cmake is the only system dep whisper-rs needs; Xcode/Metal are preinstalled.
    # Gate is "does it compile", not lint-clean — RUSTFLAGS cleared.
    runs-on: macos-latest
    env:
      RUSTFLAGS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake (whisper.cpp build dep)
        run: brew install cmake

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo build --all-targets
        run: cargo build --all-targets

  audit:
    name: cargo audit (vulnerabilities only)
    # Scans Cargo.lock against RustSec for actual vulnerabilities.
    # We skip the "unmaintained" advisory class because we knowingly depend
    # on gtk-rs GTK3 bindings (RUSTSEC-2024-0412 through -0420 mark these
    # unmaintained — gtk4-rs is the future but porting is a separate major
    # effort tracked elsewhere). Runs in parallel with the main check job.
    #
    # RUSTSEC-2026-0104 — rustls-webpki 0.103.12: reachable panic in CRL
    # (certificate revocation list) parsing. Our only use of rustls is via
    # reqwest for model downloads from huggingface.co. We do not enable CRL
    # checking in that reqwest client, so this code path is not reachable.
    # Fix: upgrade rustls-webpki to >=0.103.13 when the vendored dep allows
    # it (deps are vendored; TASK-VTT070 tracks the vendor refresh).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Scan for security vulnerabilities
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2026-0104

name: CI

# Runs on every push to main and every PR targeting main. Manual trigger
# available for rechecking after marketplace / toolchain drift.
# No untrusted input (issue/PR bodies, commit messages) is used in run: blocks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel older runs on the same ref when a newer one starts. Saves CI
# minutes when pushing quickly in succession (common during autonomous
# or long sessions). The latest push's CI is authoritative anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test + build (ubuntu-24.04)
    # ubuntu-24.04 matches Launchpad Noble builders. When we add jammy-only
    # checks later (TASK-VTT048) they go in a separate job.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system build deps (matches debian/control Build-Depends)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libvulkan-dev \
            libxtst-dev \
            libnotify-bin \
            pkg-config \
            cmake \
            glslc

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --release

      - name: cargo build --release
        run: cargo build --release

      # Sanity: the produced binary is an ELF x86_64 Linux binary linked
      # against Vulkan. Launchpad's own builder does the equivalent check.
      - name: Verify binary shape
        run: |
          file target/release/vtt-linux | grep -q "ELF 64-bit LSB.*x86-64"
          ldd target/release/vtt-linux | grep -q "libvulkan.so.1"

  audit:
    name: cargo audit (vulnerabilities only)
    # Scans Cargo.lock against RustSec for actual vulnerabilities.
    # We skip the "unmaintained" advisory class because we knowingly depend
    # on gtk-rs GTK3 bindings (RUSTSEC-2024-0412 through -0420 mark these
    # unmaintained — gtk4-rs is the future but porting is a separate major
    # effort tracked elsewhere). Runs in parallel with the main check job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Scan for security vulnerabilities
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0429

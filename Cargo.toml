[package]
name = "voice-to-text"
version = "2.4.0"
edition = "2021"
authors = ["Emmanuel Powell-Clark <emmanuel@powellclark.com>"]
description = "Free, world-class voice-to-text for Ubuntu, macOS and Windows"
license = "Apache-2.0"
repository = "https://github.com/powell-clark/voice-to-text"

[package.metadata.wix]
upgrade-guid = "4F8F8C5A-3E12-4B9D-8F7A-C6B5D2E91F03"
path-guid = "7B1E4F2A-8C9D-4E3B-A5F6-D1C7E2B89043"
license = false
eula = false

[[bin]]
name = "vtt-linux"
path = "src/main.rs"

[dependencies]
# Audio capture (cross-platform)
cpal = "0.15"
hound = "3.5"
tempfile = "3"

# Clipboard (cross-platform)
arboard = "3"

# Notifications: shelled out to notify-send on Linux (libnotify-bin is a
# runtime dep). notify-rust crate removed because its zbus 5.x transitive
# requires Rust edition 2024, which Ubuntu Noble's cargo 1.75 can't parse.

# Date/time
chrono = "0.4"

# Error handling
anyhow = "1"

# XDG/platform directories
dirs = "5"

# System FFI
libc = "0.2"

# Hashing for model integrity
sha2 = "0.10"

# Whole-word/phrase matching for the correction dictionary (FEAT-VTT037)
regex = "1"

# HTTP downloads (rustls, no OpenSSL system dep)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }

# CT2 daemon IPC wire format (ADR-0009, docs/CT2-DAEMON-PROTOCOL.md)
serde_json = "1"

# ─── Linux-specific ─────────────────────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", features = ["x11rb"] }
x11 = { version = "2.21", features = ["xlib"] }
libappindicator = "0.9"
gtk = "0.18"
glib = "0.18"
whisper-rs = { version = "0.16", default-features = false, features = ["vulkan"] }

# ─── Shared by the portable adapters (macOS + Windows) ──────────
# src/tray/portable.rs names crossbeam_channel::Receiver directly (muda's
# MenuEvent::receiver() returns one). It is only a transitive dep via
# muda/tray-icon, so the bare path won't resolve without a direct dep.
# Linux is unaffected — it uses src/tray/linux.rs (GTK), not portable.rs.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
crossbeam-channel = "0.5"

# ─── Windows ────────────────────────────────────────────────────
[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6"
tray-icon = "0.19"
muda = "0.15"
rdev = "0.5"
# Win32 message pump so the tray icon processes clicks and shows its menu
# (TASK-VTT091). tray-icon's hidden window is inert without DispatchMessage.
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
# Start-at-login toggle via the HKCU Run key (TASK-VTT094, FEAT parity VTT015).
winreg = "0.52"

# ─── Windows x86-64: Vulkan ─────────────────────────────────────
# Vendor-neutral GPU acceleration (NVIDIA/AMD/Intel) so one build accelerates
# every GPU without a CUDA Toolkit dependency (TASK-VTT088, FEAT-VTT024). Needs
# the Vulkan SDK at build time (glslc + headers + vulkan-1.lib); the runtime
# vulkan-1.dll ships with the GPU driver, and whisper-rs falls back to CPU when
# no Vulkan device is present.
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["vulkan"] }

# ─── Windows ARM64: CPU only ────────────────────────────────────
# Deliberately NOT Vulkan (TASK-VTT064). The Snapdragon's Adreno Vulkan path on
# Windows-on-ARM is unproven, and the Oryon cores run base/small models in real
# time on CPU. The generic windows cfg above matches aarch64 as well as x86_64,
# so without this split an ARM64 build would pull in Vulkan and demand an SDK
# that does not ship for the target — the arch split is what makes "CPU-only"
# true rather than merely intended.
[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", default-features = false }

# ─── macOS ──────────────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.6"
tray-icon = "0.19"
muda = "0.15"
rdev = "0.5"
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[profile.release]
opt-level = 2
strip = true
lto = true

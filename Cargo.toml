[package]
name = "voice-to-text"
version = "2.1.0"
edition = "2021"
description = "Free, world-class voice-to-text for Ubuntu, macOS and Windows"
license = "MIT"
repository = "https://github.com/powell-clark/voice-to-text"

[[bin]]
name = "vtt-linux"
path = "src/main.rs"

[dependencies]
# Audio capture (cross-platform)
cpal = "0.15"
hound = "3.5"
tempfile = "3"

# Clipboard (cross-platform)
arboard = "3"

# Notifications: shelled out to notify-send on Linux (libnotify-bin is a
# runtime dep). notify-rust crate removed because its zbus 5.x transitive
# requires Rust edition 2024, which Ubuntu Noble's cargo 1.75 can't parse.

# Date/time
chrono = "0.4"

# Error handling
anyhow = "1"

# XDG/platform directories
dirs = "5"

# System FFI
libc = "0.2"

# Hashing for model integrity
sha2 = "0.10"

# HTTP downloads (rustls, no OpenSSL system dep)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }

# ─── Linux-specific ─────────────────────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.2", features = ["x11rb"] }
x11 = { version = "2.21", features = ["xlib"] }
libappindicator = "0.9"
gtk = "0.18"
glib = "0.18"
whisper-rs = { version = "0.16", default-features = false, features = ["vulkan"] }

# ─── Shared by the portable adapters (macOS + Windows) ──────────
# src/tray/portable.rs names crossbeam_channel::Receiver directly (muda's
# MenuEvent::receiver() returns one). It is only a transitive dep via
# muda/tray-icon, so the bare path won't resolve without a direct dep.
# Linux is unaffected — it uses src/tray/linux.rs (GTK), not portable.rs.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
crossbeam-channel = "0.5"

# ─── Windows ────────────────────────────────────────────────────
[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.2"
tray-icon = "0.19"
muda = "0.15"
rdev = "0.5"
# CPU-only whisper for the first Windows cut (TASK-VTT063). No Vulkan feature
# → CI needs no Vulkan SDK, and the same CPU path serves Kyle's Snapdragon ARM
# (TASK-VTT064) where Adreno/Vulkan is unproven. GPU acceleration on Windows
# is a deliberate follow-up, not a blocker.
whisper-rs = { version = "0.16", default-features = false }

# ─── macOS ──────────────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.2"
tray-icon = "0.19"
muda = "0.15"
rdev = "0.5"
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[profile.release]
opt-level = 2
strip = true
lto = true
